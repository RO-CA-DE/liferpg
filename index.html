<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE RPG : ROLEPLAY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#eef1f6;
    --panel:#ffffff;
    --line:#e5e8ef;
    --text:#1d2028;
    --sub:#858b98;
    --accent:#6d7cff;
    --accent2:#9b7cff;
    --bubble:#f1f3f7;
    --me:#6675ff;
    --good:#46b879;
    --bad:#e35d6a;
    --shadow:0 15px 40px rgba(31,37,55,.10);
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    Arial,
    sans-serif;
    background:linear-gradient(135deg,#edf0f7,#f8f9fc);
    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   START SCREEN
========================= */

#startScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
}

.start-card{
    width:min(1000px,100%);
    background:white;
    border-radius:32px;
    box-shadow:var(--shadow);
    padding:45px;
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo small{
    display:block;
    color:var(--accent);
    font-weight:800;
    letter-spacing:4px;
    font-size:12px;
    margin-bottom:10px;
}

.logo h1{
    font-size:45px;
    letter-spacing:-2px;
}

.logo p{
    color:var(--sub);
    margin-top:10px;
}

.setup-grid{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:35px;
}

.avatar-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

.avatar-preview{
    width:190px;
    height:190px;
    border-radius:50%;
    background:#f0f2f7;
    border:6px solid #fff;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
    overflow:hidden;
}

.avatar-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.upload-btn{
    margin-top:18px;
    padding:12px 20px;
    background:#f0f2f7;
    border-radius:15px;
    font-weight:700;
}

.setup-section{
    display:flex;
    flex-direction:column;
    gap:24px;
}

.form-title{
    font-size:14px;
    font-weight:900;
    margin-bottom:9px;
}

.name-input{
    width:100%;
    height:55px;
    border:1px solid var(--line);
    border-radius:15px;
    padding:0 17px;
    outline:none;
    background:#fafbfc;
}

.name-input:focus{
    border-color:var(--accent);
    background:white;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.setup-option{
    min-height:85px;
    border:1px solid var(--line);
    border-radius:18px;
    background:#fafbfc;
    padding:14px;
    text-align:left;
    transition:.2s;
}

.setup-option:hover{
    transform:translateY(-2px);
    border-color:#bbc2ff;
}

.setup-option.selected{
    border:2px solid var(--accent);
    background:#f1f3ff;
}

.setup-option strong{
    display:block;
    font-size:14px;
    margin-bottom:6px;
}

.setup-option span{
    color:var(--sub);
    font-size:12px;
    line-height:1.45;
}

.start-button{
    height:60px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-weight:900;
    font-size:17px;
    box-shadow:0 12px 25px rgba(109,124,255,.28);
}

.start-button:hover{
    transform:translateY(-2px);
}

/* =========================
   GAME
========================= */

#gameScreen{
    min-height:100vh;
    padding:18px;
}

.game-layout{
    max-width:1600px;
    margin:auto;
    display:grid;
    grid-template-columns:280px minmax(500px,1fr) 290px;
    gap:15px;
    min-height:calc(100vh - 36px);
}

.panel{
    background:rgba(255,255,255,.94);
    border:1px solid rgba(225,229,237,.9);
    border-radius:24px;
    box-shadow:0 8px 30px rgba(30,36,55,.07);
}

/* =========================
   LEFT
========================= */

.left-panel{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow:auto;
}

.profile-card{
    text-align:center;
}

.game-avatar{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;
    background:#f0f2f7;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    border:4px solid white;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.game-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.player-name{
    font-size:21px;
    font-weight:900;
    margin-top:12px;
}

.player-age{
    color:var(--sub);
    font-size:13px;
    margin-top:4px;
}

.age-progress{
    margin-top:15px;
    background:#f0f2f6;
    border-radius:999px;
    height:8px;
    overflow:hidden;
}

.age-progress div{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:.4s;
}

.section-title{
    font-size:11px;
    color:#9aa0ad;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:10px;
}

.stat{
    margin-bottom:11px;
}

.stat-top{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:5px;
}

.stat-top b{
    font-weight:800;
}

.stat-bar{
    height:7px;
    background:#f0f2f5;
    border-radius:999px;
    overflow:hidden;
}

.stat-bar div{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7584ff,#a47fff);
    transition:.4s;
}

.relation{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px;
    border-radius:14px;
    background:#f8f9fb;
    margin-bottom:7px;
}

.relation-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#e9ebf1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.relation-info{
    flex:1;
}

.relation-info strong{
    font-size:12px;
    display:block;
}

.relation-info span{
    font-size:10px;
    color:var(--sub);
}

.relationship-bar{
    margin-top:4px;
    height:4px;
    border-radius:99px;
    background:#e5e7ed;
    overflow:hidden;
}

.relationship-bar div{
    height:100%;
    background:#8b95ff;
}

/* =========================
   CENTER CHAT
========================= */

.center-panel{
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
}

.chat-header{
    height:82px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    flex-shrink:0;
}

.header-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.scene-dot{
    width:11px;
    height:11px;
    background:#55c886;
    border-radius:50%;
    box-shadow:0 0 0 5px #e4f7ed;
}

.scene-title{
    font-size:16px;
    font-weight:900;
}

.scene-sub{
    color:var(--sub);
    font-size:11px;
    margin-top:3px;
}

.header-actions{
    display:flex;
    gap:7px;
}

.small-btn{
    padding:9px 12px;
    border-radius:11px;
    background:#f2f3f7;
    color:#606574;
    font-size:11px;
    font-weight:800;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px;
    scroll-behavior:smooth;
}

.day-divider{
    text-align:center;
    color:#a2a6b1;
    font-size:10px;
    margin:5px 0 25px;
}

.message-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    animation:messageIn .25s ease;
}

.message-row.me{
    flex-direction:row-reverse;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.message-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#edf0f5;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:20px;
}

.message-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.message-content{
    max-width:72%;
}

.message-name{
    color:#7d8290;
    font-size:10px;
    font-weight:800;
    margin:0 0 5px 3px;
}

.message-row.me .message-name{
    text-align:right;
    margin-right:3px;
}

.bubble{
    background:var(--bubble);
    border-radius:4px 18px 18px 18px;
    padding:12px 15px;
    font-size:13px;
    line-height:1.55;
    white-space:pre-wrap;
}

.message-row.me .bubble{
    background:var(--me);
    color:white;
    border-radius:18px 4px 18px 18px;
}

.message-time{
    font-size:9px;
    color:#b1b5bf;
    margin-top:4px;
    padding:0 3px;
}

.typing-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.typing{
    background:#f0f2f6;
    padding:12px 16px;
    border-radius:4px 18px 18px 18px;
    display:flex;
    gap:4px;
}

.typing i{
    width:5px;
    height:5px;
    background:#9da3af;
    border-radius:50%;
    animation:bounce 1s infinite;
}

.typing i:nth-child(2){
    animation-delay:.15s;
}

.typing i:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{transform:translateY(0)}
    30%{transform:translateY(-4px)}
}

/* =========================
   CHOICES
========================= */

.choice-area{
    border-top:1px solid var(--line);
    padding:15px 20px 17px;
    background:#fff;
    flex-shrink:0;
}

.choice-label{
    font-size:10px;
    font-weight:900;
    color:#9ca1ac;
    margin-bottom:8px;
}

.choices{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.choice{
    text-align:left;
    min-height:50px;
    padding:10px 13px;
    border-radius:14px;
    background:#f5f6f9;
    border:1px solid #e8eaf0;
    font-size:12px;
    line-height:1.4;
    transition:.18s;
}

.choice:hover{
    background:#ecefff;
    border-color:#c9ceff;
    transform:translateY(-1px);
}

.choice:disabled{
    opacity:.45;
    cursor:wait;
}

.free-input{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.free-input input{
    flex:1;
    height:43px;
    border:1px solid var(--line);
    border-radius:13px;
    padding:0 13px;
    outline:none;
    font-size:12px;
    background:#fafbfc;
}

.free-input button{
    width:60px;
    border-radius:13px;
    background:#242735;
    color:white;
    font-weight:800;
    font-size:11px;
}

/* =========================
   RIGHT
========================= */

.right-panel{
    padding:18px;
    display:flex;
    flex-direction:column;
    overflow:auto;
}

.log-box{
    background:#f8f9fb;
    border-radius:17px;
    padding:13px;
    margin-bottom:8px;
}

.log-time{
    font-size:9px;
    color:#a4a8b2;
    margin-bottom:4px;
}

.log-text{
    font-size:11px;
    line-height:1.5;
}

.memory{
    padding:11px;
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:7px;
}

.memory strong{
    display:block;
    font-size:11px;
    margin-bottom:4px;
}

.memory span{
    font-size:10px;
    color:var(--sub);
    line-height:1.4;
}

.badge{
    display:inline-flex;
    padding:5px 8px;
    border-radius:8px;
    background:#f0f1ff;
    color:#6875df;
    font-size:9px;
    font-weight:900;
    margin:2px;
}

/* =========================
   MODALS
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(20,24,34,.45);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal{
    width:min(600px,100%);
    background:white;
    border-radius:26px;
    padding:28px;
    box-shadow:0 25px 70px rgba(0,0,0,.2);
    max-height:90vh;
    overflow:auto;
}

.modal h2{
    font-size:22px;
    margin-bottom:8px;
}

.modal p{
    color:var(--sub);
    font-size:12px;
    line-height:1.6;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
    height:46px;
    border-radius:13px;
    font-weight:800;
}

.primary{
    background:#6877ff;
    color:white;
}

.secondary{
    background:#f0f2f6;
    color:#555a67;
}

/* =========================
   AGE TRANSITION
========================= */

.age-card{
    text-align:center;
}

.age-big{
    font-size:75px;
    font-weight:1000;
    letter-spacing:-5px;
    margin:20px 0;
}

.age-subtitle{
    color:var(--sub);
    line-height:1.7;
}

/* =========================
   ENDING
========================= */

#endingScreen{
    min-height:100vh;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.ending-card{
    width:min(850px,100%);
    background:white;
    border-radius:35px;
    padding:50px;
    text-align:center;
    box-shadow:var(--shadow);
}

.ending-icon{
    font-size:75px;
    margin-bottom:20px;
}

.ending-card h1{
    font-size:38px;
    margin-bottom:12px;
}

.ending-card .ending-desc{
    color:#707582;
    line-height:1.8;
    max-width:650px;
    margin:0 auto;
}

.ending-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:30px 0;
}

.ending-stat{
    background:#f6f7fa;
    border-radius:16px;
    padding:15px;
}

.ending-stat span{
    display:block;
    color:#969aa5;
    font-size:10px;
}

.ending-stat b{
    display:block;
    margin-top:5px;
    font-size:18px;
}

@media(max-width:1100px){
    .game-layout{
        grid-template-columns:230px minmax(450px,1fr);
    }

    .right-panel{
        display:none;
    }
}

@media(max-width:750px){
    #gameScreen{
        padding:0;
    }

    .game-layout{
        display:block;
        min-height:100vh;
    }

    .left-panel{
        display:none;
    }

    .center-panel{
        border-radius:0;
        min-height:100vh;
    }

    .setup-grid{
        grid-template-columns:1fr;
    }

    .start-card{
        padding:25px;
    }

    .option-grid{
        grid-template-columns:1fr;
    }

    .choices{
        grid-template-columns:1fr;
    }

    .message-content{
        max-width:80%;
    }
}
</style>
</head>

<body>

<!-- =========================
     START
========================= -->

<section id="startScreen">

<div class="start-card">

    <div class="logo">
        <small>LIFE RPG : ROLEPLAY</small>
        <h1>당신의 인생을 시작하세요.</h1>
        <p>이번 생은 정해진 스토리가 없습니다.</p>
    </div>

    <div class="setup-grid">

        <div class="avatar-section">

            <div class="avatar-preview" id="startAvatar">
                🧑🏻
            </div>

            <input
                type="file"
                id="avatarInput"
                accept="image/*"
                hidden
            >

            <button
                class="upload-btn"
                onclick="document.getElementById('avatarInput').click()"
            >
                📷 아바타 업로드
            </button>

        </div>

        <div class="setup-section">

            <div>
                <div class="form-title">이름</div>

                <input
                    id="nameInput"
                    class="name-input"
                    maxlength="12"
                    placeholder="이름을 입력하세요"
                >
            </div>

            <div>
                <div class="form-title">가족 분위기</div>

                <div class="option-grid">

                    <button class="setup-option selected" data-type="family" data-value="warm">
                        <strong>🏠 따뜻한 가족</strong>
                        <span>서로를 많이 챙기고 대화가 많은 가족</span>
                    </button>

                    <button class="setup-option" data-type="family" data-value="normal">
                        <strong>🌿 평범한 가족</strong>
                        <span>잔잔하고 현실적인 일상을 보내는 가족</span>
                    </button>

                    <button class="setup-option" data-type="family" data-value="busy">
                        <strong>💼 바쁜 가족</strong>
                        <span>각자 바쁘지만 마음속으로는 서로를 아끼는 가족</span>
                    </button>

                </div>
            </div>

            <div>
                <div class="form-title">어린 시절 성향</div>

                <div class="option-grid">

                    <button class="setup-option selected" data-type="personality" data-value="curious">
                        <strong>🔎 호기심형</strong>
                        <span>뭐든 만져보고 관찰하려 한다</span>
                    </button>

                    <button class="setup-option" data-type="personality" data-value="social">
                        <strong>🫶 사교형</strong>
                        <span>사람의 표정과 목소리에 민감하다</span>
                    </button>

                    <button class="setup-option" data-type="personality" data-value="calm">
                        <strong>🌙 차분형</strong>
                        <span>조용히 주변을 관찰하는 것을 좋아한다</span>
                    </button>

                    <button class="setup-option" data-type="personality" data-value="active">
                        <strong>⚡ 활동형</strong>
                        <span>몸을 움직이는 것을 좋아한다</span>
                    </button>

                    <button class="setup-option" data-type="personality" data-value="creative">
                        <strong>🎨 창작형</strong>
                        <span>소리, 그림, 모양에 관심이 많다</span>
                    </button>

                    <button class="setup-option" data-type="personality" data-value="funny">
                        <strong>🤣 장난형</strong>
                        <span>어릴 때부터 분위기를 뒤집는 재주가 있다</span>
                    </button>

                </div>
            </div>

            <button
                class="start-button"
                onclick="startGame()"
            >
                ✨ 인생 시작하기
            </button>

        </div>

    </div>

</div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="hidden">

<div class="game-layout">

    <!-- LEFT -->

    <aside class="panel left-panel">

        <div class="profile-card">

            <div class="game-avatar" id="gameAvatar">
                🧑🏻
            </div>

            <div class="player-name" id="playerName">
                -
            </div>

            <div class="player-age" id="playerAge">
                -
            </div>

            <div class="age-progress">
                <div id="ageProgress"></div>
            </div>

        </div>


        <div>

            <div class="section-title">ABILITY</div>

            <div class="stat">
                <div class="stat-top">
                    <b>🧠 지능</b>
                    <span id="stat-intelligence">0</span>
                </div>
                <div class="stat-bar">
                    <div id="bar-intelligence"></div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-top">
                    <b>🎨 창의성</b>
                    <span id="stat-creativity">0</span>
                </div>
                <div class="stat-bar">
                    <div id="bar-creativity"></div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-top">
                    <b>💗 공감</b>
                    <span id="stat-empathy">0</span>
                </div>
                <div class="stat-bar">
                    <div id="bar-empathy"></div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-top">
                    <b>🔥 용기</b>
                    <span id="stat-courage">0</span>
                </div>
                <div class="stat-bar">
                    <div id="bar-courage"></div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-top">

/* ============================================================

============================================================ */

function startGame(){

        .getElementById("startScreen")

/* ============================================================
   PERSONALITY BONUS
============================================================ */

function applyPersonalityBonus(){

    if(G.personality==="curious"){
        G.stats.creativity+=3;
        G.stats.intelligence+=2;
    }

    if(G.personality==="social"){
        G.stats.empathy+=4;
        G.stats.charm+=3;
    }

    if(G.personality==="calm"){
        G.stats.empathy+=3;
        G.stats.intelligence+=2;
        G.stats.happiness+=3;
    }

    if(G.personality==="active"){
        G.stats.courage+=4;
        G.stats.happiness+=3;
    }

    if(G.personality==="creative"){
        G.stats.creativity+=6;
    }

    if(G.personality==="funny"){
        G.stats.charm+=4;
        G.stats.creativity+=2;
    }

}


/* ============================================================
   EFFECT ENGINE
============================================================ */

function applyEffects(effects={}){

    Object.keys(effects).forEach(key=>{

        if(key.startsWith("rel_")){

            const id=key.replace("rel_","");

            if(G.relations[id]!==undefined){

                G.relations[id]+=effects[key];

                G.relations[id]=clamp(
                    G.relations[id],
                    0,
                    100
                );

            }

            return;
        }

        if(key.startsWith("flag_")){

            const id=key.replace("flag_","");

            G.flags[id]=effects[key];

            return;
        }

        if(G.stats[key]!==undefined){

            G.stats[key]+=effects[key];

            if(key!=="money"){

                G.stats[key]=clamp(
                    G.stats[key],
                    0,
                    100
                );

            }

            if(key==="money"){

                G.stats.money=Math.max(
                    0,
                    G.stats.money
                );

            }

        }

    });

}


function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* ============================================================
   CHAT
============================================================ */

function addMessage(type,npc,text){

    const chat=document.getElementById("chat");

    const row=document.createElement("div");

    row.className="message-row "+type;

    let avatar="";

    if(type==="me"){

        if(G.avatarData){

            avatar=
                `<img src="${G.avatarData}">`;

        }else{

            avatar="🧑🏻";

        }

    }else{

        const data=NPC[npc]||NPC.narrator;

        avatar=data.avatar;

    }

    let name="";

    if(type==="me"){

        name=G.name;

    }else{

        name=(NPC[npc]||NPC.narrator).name;

    }

    const now=new Date();

    const time=
        String(now.getHours()).padStart(2,"0")
        +":"
        +
        String(now.getMinutes()).padStart(2,"0");

    row.innerHTML=`

        <div class="message-avatar">
            ${avatar}
        </div>

        <div class="message-content">

            <div class="message-name">
                ${escapeHTML(name)}
            </div>

            <div class="bubble">
                ${escapeHTML(text)}
            </div>

            <div class="message-time">
                ${time}
            </div>

        </div>
    `;

    chat.appendChild(row);

    chat.scrollTop=chat.scrollHeight;

}


function escapeHTML(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ============================================================
   TYPING
============================================================ */

function showTyping(npc){

    const chat=document.getElementById("chat");

    const row=document.createElement("div");

    row.className="typing-row";

    const avatar=
        NPC[npc]?.avatar ||
        NPC.narrator.avatar;

    row.innerHTML=`

        <div class="message-avatar">
            ${avatar}
        </div>

        <div class="typing">
            <i></i>
            <i></i>
            <i></i>
        </div>

    `;

    chat.appendChild(row);

    chat.scrollTop=chat.scrollHeight;

    return row;

}


/* ============================================================
   SCENE ENGINE
============================================================ */

function startScene(id){

    const scene=SCENES[id];

    if(!scene){

        console.error("SCENE NOT FOUND:",id);

        return;
    }

    G.sceneId=id;
    G.currentChoices=scene.choices||[];

    document.getElementById("sceneTitle").textContent=
        scene.title||"새로운 장면";

    document.getElementById("sceneSubtitle").textContent=
        scene.subtitle||getAgeLabel();

    renderChoices([]);

    if(scene.clearChat){

        document.getElementById("chat").innerHTML="";

    }

    if(scene.day){

        const divider=document.createElement("div");

        divider.className="day-divider";

        divider.textContent=scene.day;

        document
            .getElementById("chat")
            .appendChild(divider);

    }

    playSceneMessages(
        scene.messages||[],
        0,
        ()=>{

            if(scene.autoChoices){

                renderChoices(scene.choices||[]);

            }else{

                renderChoices(scene.choices||[]);

            }

        }
    );

}


function playSceneMessages(messages,index,done){

    if(index>=messages.length){

        done();

        return;
    }

    const item=messages[index];

    setTimeout(()=>{

        addMessage(
            item.type||"npc",
            item.npc||"narrator",
            item.text
        );

        playSceneMessages(
            messages,
            index+1,
            done
        );

    },index===0?300:650);

}


/* ============================================================
   EXACT CHOICE ENGINE
============================================================ */

function renderChoices(choices){

    const box=document.getElementById("choices");

    box.innerHTML="";

    G.currentChoices=choices;

    choices.forEach((choice,index)=>{

        const button=document.createElement("button");

        button.className="choice";

        button.textContent=choice.text;

        button.onclick=()=>chooseChoice(index);

        box.appendChild(button);

    });

}


function lockChoices(){

    document
        .querySelectorAll(".choice")
        .forEach(btn=>btn.disabled=true);

}


function chooseChoice(index){

    if(G.busy)return;

    const choice=G.currentChoices[index];

    if(!choice)return;

    G.busy=true;

    lockChoices();

    G.lastAction=choice.action;

    G.lastChoiceText=choice.text;

    applyEffects(choice.effects||{});

    addMessage(
        "me",
        null,
        choice.text
    );

    addLog(
        choice.text
    );

    if(choice.memory){

        addMemory(
            choice.memory.title,
            choice.memory.text
        );

    }

    updateUI();

    setTimeout(()=>{

        if(choice.responses){

            playResponses(
                choice.responses,
                0,
                ()=>finishChoice(choice)
            );

        }else{

            finishChoice(choice);

        }

    },500);

}


function playResponses(responses,index,done){

    if(index>=responses.length){

        done();

        return;
    }

    const response=responses[index];

    const typing=showTyping(
        response.npc||"narrator"
    );

    setTimeout(()=>{

        typing.remove();

        addMessage(
            "npc",
            response.npc||"narrator",
            response.text
        );

        playResponses(
            responses,
            index+1,
            done
        );

    },response.delay||650);

}


function finishChoice(choice){

    setTimeout(()=>{

        if(choice.next){

            G.busy=false;

            startScene(choice.next);

            return;

        }

        if(choice.nextAge){

            G.busy=false;

            advanceAge(choice.nextAge);

            return;

        }

        if(choice.nextChoices){

            G.busy=false;

            renderChoices(
                choice.nextChoices
            );

            return;

        }

        G.busy=false;

        renderChoices([]);

    },400);

}


/* ============================================================
   FREE TEXT
============================================================ */

function sendFreeText(){

    if(G.busy)return;

    const input=document.getElementById("freeInput");

    const text=input.value.trim();

    if(!text)return;

    input.value="";

    G.busy=true;

    addMessage(
        "me",
        null,
        text
    );

    addLog(
        "직접 행동/대화: "+text
    );

    setTimeout(()=>{

        const response=
            getFreeTextResponse(text);

        const typing=
            showTyping(
                response.npc
            );

        setTimeout(()=>{

            typing.remove();

            addMessage(
                "npc",
                response.npc,
                response.text
            );

            G.busy=false;

        },700);

    },500);

}

/* ============================================================
   GENERATE LATER AGE SCENES
============================================================ */

function generateAgeScene(age){

    if(age===3){

        return buildChildScene(
            3,
            "유치원 생활",
            [
                ["🎨 그림을 그린다","draw",{"creativity":4}],
                ["🧸 친구와 역할놀이를 한다","roleplay",{"empathy":4}],
                ["🤣 친구를 웃긴다","funny",{"charm":4}]
            ]
        );

    }

    if(age===4){

        return buildChildScene(
            4,
            "어린이집/유치원 오후",
            [
                ["🧩 퍼즐을 맞춘다","puzzle",{"intelligence":4}],
                ["🏃 바깥놀이를 한다","outside",{"courage":4}],
                ["🎵 노래를 따라 부른다","sing",{"creativity":4}]
            ]
        );

    }

    if(age===5){

        return buildChildScene(
            5,
            "초등학교 입학 전",
            [
                ["📚 책을 읽어본다","book",{"intelligence":4}],
                ["🎨 그림을 그린다","art",{"creativity":4}],
                ["🫶 친구와 논다","friend",{"empathy":4}]
            ]
        );

    }

    if(age>=6 && age<=12){

        return buildSchoolScene(age);

    }

    if(age===13){

        return buildMiddleSchoolScene();

    }

    if(age>=14 && age<=18){

        return buildTeenScene(age);

    }

    if(age>=19 && age<=24){

        return buildAdultYoungScene(age);

    }

    if(age>=25 && age<=39){

        return buildCareerScene(age);

    }

    if(age>=40 && age<=59){

        return buildMiddleAgeScene(age);

    }

    if(age>=60 && age<=69){

        return buildSeniorScene(age);

    }

    if(age>=70 && age<80){

        return buildLateLifeScene(age);

    }

    return null;

}

        messages:[

/* ============================================================
   ADVANCE AGE
============================================================ */

function advanceAge(nextAge){

    if(nextAge>80){

        endGame();

        return;
    }

    G.age=nextAge;

    if(nextAge===1){

        G.month=12;

    }else if(nextAge===2){

        G.month=24;

    }else{

        G.month=nextAge*12;

    }

    if(!G.completedAges.includes(nextAge-1)){

        G.completedAges.push(nextAge-1);

    }

    updateUI();

    showAgeTransition(nextAge);

}


/* ============================================================
   AGE TRANSITION
============================================================ */

function showAgeTransition(age){

    const modal=document.getElementById("modalBg");

    const box=document.getElementById("modal");

    box.innerHTML=`

        <div class="age-card">

            <div class="section-title">
                TIME PASSED
            </div>

            <div class="age-big">
                ${age}
            </div>

            <h2>
                ${age}살이 되었습니다.
            </h2>

            <p class="age-subtitle">
                ${ageDevelopment()}
            </p>

            <div class="modal-actions">

                <button
                    class="primary"
                    onclick="closeAgeTransition(${age})"
                >
                    계속하기
                </button>

            </div>

        </div>
    `;

    modal.classList.remove("hidden");

}


function closeAgeTransition(age){

    document
        .getElementById("modalBg")
        .classList.add("hidden");

    let scene;

    if(age===2){

        scene=SCENES.age2_start;

    }else{

        scene=generateAgeScene(age);

    }

    if(scene){

        const id=
            "runtime_"+Date.now();

        SCENES[id]=scene;

        startScene(id);

    }

}

   UI UPDATE
============================================================ */

function updateUI(){

    document.getElementById("playerName")
        .textContent=G.name;

    document.getElementById("playerAge")
        .textContent=getAgeLabel();

    const avatar=
        document.getElementById("gameAvatar");

    if(G.avatarData){

        avatar.innerHTML=

        "creativity",
        "empathy",
        "courage",
        "charm",
        "luck",
        "happiness"
    ];

function updateMemories(){

                    ${escapeHTML(m.text)}

function updateBadges(){

    const box=
        document.getElementById("badges");

    if(!G.badges.length){

        box.innerHTML=
            `<span style="font-size:10px;color:#aaa;">
                아직 뱃지가 없습니다.
            </span>`;

        return;

                ${b.icon} ${escapeHTML(b.name)}
            </span>`

/* ============================================================
   MEMORY
============================================================ */

function addMemory(title,text){

    G.memories.push({

        title,
        text,
        age:G.age,
        month:G.month,
        time:Date.now()

    });

    if(G.memories.length>50){

        G.memories.shift();

    }

    updateMemories();

}


/* ============================================================
   BADGE
============================================================ */

function addBadge(icon,name){

    if(
        G.badges.some(
            x=>x.name===name
        )
    )return;

    G.badges.push({
        icon,
        name
    });

    updateBadges();

}


/* ============================================================
   LOG
============================================================ */

function addLog(text){

    G.logs.push({

        age:G.age,
        month:G.month,
        text,
        time:Date.now()

    });

    if(G.logs.length>100){

        G.logs.shift();

    }

    renderLogs();

}


function renderLogs(){

    const box=
        document.getElementById("lifeLog");

    box.innerHTML=
        G.logs
        .slice()
        .reverse()
        .slice(0,20)
        .map(log=>`

            <div class="log-box">

                <div class="log-time">
                    ${log.age}살 · ${log.month}개월
                </div>

                <div class="log-text">
                    ${escapeHTML(log.text)}
                </div>

            </div>

        `)
        .join("");

}


/* ============================================================
   SAVE
============================================================ */

function saveGame(){

    localStorage.setItem(
        "life_rpg_save",
        JSON.stringify(G)
    );

    toast("게임이 저장되었습니다 💾");

}


function loadGame(){

    const raw=
        localStorage.getItem(
            "life_rpg_save"
        );

    if(!raw){

        alert("저장된 게임이 없습니다.");

        return;
    }

    try{

        const data=JSON.parse(raw);

        Object.assign(G,data);

        document
            .getElementById("startScreen")
            .classList.add("hidden");

        document
            .getElementById("gameScreen")
            .classList.remove("hidden");

        updateUI();

        renderLogs();

        if(G.sceneId){

            if(SCENES[G.sceneId]){

                startScene(G.sceneId);

            }else{

                const generated=
                    getGeneratedScene(
                        G.sceneId
                    );

                if(generated){

                    SCENES[G.sceneId]=generated;

                    startScene(G.sceneId);

                }else{

                    startScene("age1_birth");

                }

            }

        }

        toast("게임을 불러왔습니다 📂");

    }catch(e){

        console.error(e);

        alert("저장 데이터를 불러오지 못했습니다.");

    }

}

/* ============================================================
   TOAST
============================================================ */

function toast(text){

    const old=
        document.getElementById("toast");

    if(old)old.remove();

    const div=
        document.createElement("div");

    div.id="toast";

    div.textContent=text;

    div.style.position="fixed";
    div.style.bottom="25px";
    div.style.left="50%";
    div.style.transform="translateX(-50%)";
    div.style.padding="12px 18px";
    div.style.background="#252834";
    div.style.color="#fff";
    div.style.borderRadius="14px";
    div.style.fontSize="12px";
    div.style.fontWeight="800";
    div.style.zIndex="9999";
    div.style.boxShadow=
        "0 10px 30px rgba(0,0,0,.2)";

    document.body.appendChild(div);

    setTimeout(()=>{

        div.remove();

    },1800);

}
