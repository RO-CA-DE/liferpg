<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE RPG : MY LIFE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f6fa;
    --card:#ffffff;
    --line:#e8e9ef;
    --text:#17181c;
    --sub:#777b86;
    --accent:#6c63ff;
    --accent2:#9b95ff;
    --me:#6c63ff;
    --npc:#ffffff;
    --danger:#ff5c70;
    --shadow:0 10px 35px rgba(25,28,40,.07);
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
    min-height:100vh;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   START
========================= */

#startScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.start-box{
    width:min(620px,100%);
    background:#fff;
    border:1px solid var(--line);
    border-radius:30px;
    padding:42px;
    box-shadow:var(--shadow);
}

.logo{
    font-size:14px;
    letter-spacing:4px;
    color:var(--accent);
    font-weight:800;
    margin-bottom:12px;
}

.start-title{
    font-size:44px;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:10px;
}

.start-desc{
    color:var(--sub);
    line-height:1.7;
    margin-bottom:32px;
}

.form-title{
    font-size:13px;
    font-weight:800;
    color:#555;
    margin-bottom:10px;
}

.name-input{
    width:100%;
    height:55px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:0 18px;
    outline:none;
    font-size:16px;
    margin-bottom:24px;
}

.name-input:focus{
    border-color:var(--accent2);
}

.avatar-upload{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:28px;
}

.avatar-preview{
    width:82px;
    height:82px;
    border-radius:25px;
    background:#eef0f5;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex:none;
    font-size:30px;
}

.avatar-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.upload-label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 17px;
    border-radius:13px;
    background:#f1f2f6;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.upload-label input{
    display:none;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:28px;
}

.start-option{
    border:1px solid var(--line);
    background:#fff;
    border-radius:16px;
    padding:15px 10px;
    font-size:13px;
    line-height:1.4;
}

.start-option.active{
    border-color:var(--accent);
    background:#f4f3ff;
    color:var(--accent);
    font-weight:800;
}

.start-button{
    width:100%;
    height:58px;
    border-radius:18px;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:800;
}

/* =========================
   GAME
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
}

.topbar{
    height:72px;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:30;
}

.top-logo{
    font-weight:900;
    letter-spacing:-.5px;
}

.top-age{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--sub);
}

.age-pill{
    background:#f0efff;
    color:var(--accent);
    padding:7px 12px;
    border-radius:20px;
    font-weight:900;
}

.top-actions{
    display:flex;
    gap:7px;
}

.top-actions button{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#f3f4f7;
    font-size:16px;
}

.layout{
    width:min(1500px,100%);
    margin:0 auto;
    padding:20px;
    display:grid;
    grid-template-columns:280px minmax(500px,760px) 280px;
    gap:18px;
}

/* LEFT */

.sidebar{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px;
    box-shadow:0 5px 20px rgba(20,20,30,.025);
}

.profile-card{
    text-align:center;
}

.big-avatar{
    width:100px;
    height:100px;
    border-radius:30px;
    background:#f0f1f5;
    overflow:hidden;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.big-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.player-name{
    font-size:19px;
    font-weight:900;
}

.player-age{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
}

.panel-title{
    font-size:12px;
    font-weight:900;
    color:#858894;
    margin-bottom:14px;
    letter-spacing:.5px;
}

.stat{
    margin-bottom:11px;
}

.stat:last-child{
    margin-bottom:0;
}

.stat-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:5px;
}

.stat-bar{
    height:6px;
    background:#eef0f4;
    border-radius:10px;
    overflow:hidden;
}

.stat-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:10px;
    transition:.3s;
}

.npc-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.npc-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
    border-radius:13px;
    background:#f8f8fa;
}

.npc-mini{
    width:35px;
    height:35px;
    border-radius:11px;
    background:#e9eaf0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
}

.npc-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.npc-info{
    min-width:0;
}

.npc-name{
    font-size:12px;
    font-weight:800;
}

.npc-rel{
    font-size:10px;
    color:var(--sub);
}

/* CENTER */

.chat-panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    min-height:calc(100vh - 112px);
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
}

.scene-header{
    padding:20px 22px;
    border-bottom:1px solid var(--line);
    flex:none;
}

.scene-label{
    font-size:11px;
    font-weight:900;
    color:var(--accent);
    letter-spacing:1px;
    margin-bottom:6px;
}

.scene-title{
    font-size:20px;
    font-weight:900;
    letter-spacing:-.5px;
}

.scene-sub{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
}

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:24px 25px 15px;
    scroll-behavior:smooth;
    min-height:500px;
}

.day-divider{
    text-align:center;
    margin:12px 0 25px;
    font-size:11px;
    color:#999da7;
}

.message{
    display:flex;
    gap:9px;
    margin-bottom:17px;
    animation:messageIn .28s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.me{
    flex-direction:row-reverse;
}

.message-avatar{
    width:36px;
    height:36px;
    border-radius:13px;
    background:#eef0f5;
    overflow:hidden;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

.message-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.message-body{
    max-width:72%;
}

.message-name{
    font-size:10px;
    color:#969aa4;
    margin-bottom:5px;
    font-weight:700;
}

.message.me .message-name{
    text-align:right;
}

.bubble{
    display:inline-block;
    padding:11px 14px;
    border-radius:17px;
    background:#f2f3f6;
    font-size:14px;
    line-height:1.55;
    word-break:keep-all;
}

.message.me .bubble{
    background:var(--me);
    color:#fff;
    border-bottom-right-radius:5px;
}

.message:not(.me) .bubble{
    border-bottom-left-radius:5px;
}

.typing{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 17px 45px;
}

.typing-dots{
    background:#f1f2f5;
    padding:10px 13px;
    border-radius:16px;
}

.typing-dots span{
    display:inline-block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#999;
    margin:0 2px;
    animation:bounce 1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{transform:translateY(0)}
    30%{transform:translateY(-4px)}
}

/* CHOICES */

.choice-area{
    border-top:1px solid var(--line);
    background:#fff;
    padding:15px;
    flex:none;
}

.choice-hint{
    text-align:center;
    color:#a0a3ac;
    font-size:10px;
    margin-bottom:9px;
}

.choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.choice-btn{
    text-align:left;
    padding:13px 14px;
    background:#f6f7f9;
    border:1px solid #eceef2;
    border-radius:15px;
    font-size:13px;
    font-weight:700;
    line-height:1.4;
    transition:.15s;
}

.choice-btn:hover{
    background:#efefff;
    border-color:#dcd9ff;
    transform:translateY(-1px);
}

.choice-btn:disabled{
    opacity:.5;
    cursor:default;
}

.free-input{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.free-input input{
    flex:1;
    height:42px;
    border:1px solid var(--line);
    border-radius:13px;
    outline:none;
    padding:0 13px;
    font-size:12px;
}

.free-input button{
    width:50px;
    border-radius:13px;
    background:#f0efff;
    color:var(--accent);
    font-weight:900;
}

/* RIGHT */

.log-list{
    max-height:230px;
    overflow-y:auto;
}

.log-item{
    padding:8px 0;
    border-bottom:1px solid #f0f1f4;
    font-size:11px;
    line-height:1.5;
}

.log-item:last-child{
    border-bottom:0;
}

.log-age{
    color:var(--accent);
    font-weight:900;
}

.quest{
    padding:12px;
    background:#f7f7fa;
    border-radius:14px;
    font-size:11px;
    line-height:1.5;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.badge{
    padding:6px 8px;
    border-radius:9px;
    background:#f0efff;
    color:#625bdf;
    font-size:10px;
    font-weight:800;
}

/* END */

.end-screen{
    position:fixed;
    inset:0;
    background:rgba(15,16,22,.6);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.end-box{
    background:#fff;
    width:min(650px,100%);
    border-radius:30px;
    padding:42px;
    text-align:center;
}

.end-icon{
    font-size:55px;
    margin-bottom:10px;
}

.end-box h1{
    font-size:32px;
    margin-bottom:10px;
}

.end-box p{
    color:#71747e;
    line-height:1.7;
    margin-bottom:25px;
}

.end-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:22px;
}

.end-stat{
    background:#f6f7f9;
    padding:13px;
    border-radius:14px;
}

.end-stat b{
    display:block;
    font-size:18px;
    margin-top:3px;
}

.end-buttons{
    display:flex;
    gap:8px;
}

.end-buttons button{
    flex:1;
    height:50px;
    border-radius:15px;
    font-weight:800;
}

.restart{
    background:var(--accent);
    color:#fff;
}

.close-end{
    background:#f1f2f5;
}

/* responsive */

@media(max-width:1150px){
    .layout{
        grid-template-columns:220px minmax(450px,1fr);
    }

    .right-sidebar{
        display:none;
    }
}

@media(max-width:780px){
    .layout{
        display:block;
        padding:8px;
    }

    .left-sidebar{
        display:none;
    }

    .chat-panel{
        min-height:calc(100vh - 88px);
    }

    .topbar{
        padding:0 12px;
    }

    .choices{
        grid-template-columns:1fr;
    }

    .start-box{
        padding:28px 20px;
    }

    .start-title{
        font-size:34px;
    }
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<section id="startScreen">

    <div class="start-box">

        <div class="logo">LIFE RPG</div>

        <div class="start-title">
            MY LIFE
        </div>

        <div class="start-desc">
            태어난 순간부터 시작되는 단 한 번의 인생.<br>
            선택한 말과 행동은 사람들의 기억에 남고,<br>
            관계와 사건은 시간이 지나도 이어진다.
        </div>

        <div class="form-title">이름</div>

        <input
            id="nameInput"
            class="name-input"
            maxlength="12"
            placeholder="주인공 이름을 입력해줘"
        >

        <div class="form-title">내 아바타</div>

        <div class="avatar-upload">

            <div id="avatarPreview" class="avatar-preview">
                👶
            </div>

            <label class="upload-label">
                📷 사진 선택
                <input
                    id="avatarInput"
                    type="file"
                    accept="image/*"
                >
            </label>

        </div>

        <div class="form-title">어떤 어린 시절을 보낼까?</div>

        <div class="option-grid">

            <button
                class="start-option active"
                data-type="family"
                data-value="warm"
            >
                🏡 따뜻한 가족
            </button>

            <button
                class="start-option"
                data-type="family"
                data-value="busy"
            >
                🏙️ 바쁜 가족
            </button>

            <button
                class="start-option"
                data-type="family"
                data-value="free"
            >
                🌿 자유로운 가족
            </button>

        </div>

        <div class="option-grid">

            <button
                class="start-option active"
                data-type="personality"
                data-value="curious"
            >
                🔎 호기심
            </button>

            <button
                class="start-option"
                data-type="personality"
                data-value="calm"
            >
                🌙 차분함
            </button>

            <button
                class="start-option"
                data-type="personality"
                data-value="bold"
            >
                ⚡ 당돌함
            </button>

        </div>

        <button id="startButton" class="start-button">
            ✨ 내 인생 시작하기
        </button>

    </div>

</section>


<!-- =========================
     GAME SCREEN
========================= -->

<section id="gameScreen">

    <header class="topbar">

        <div class="top-logo">
            LIFE RPG
        </div>

        <div class="top-age">
            <span id="topAgeText">AGE 1</span>
            <span id="agePill" class="age-pill">1살</span>
        </div>

        <div class="top-actions">
            <button id="saveBtn" title="저장">💾</button>
            <button id="loadBtn" title="불러오기">📂</button>
            <button id="resetBtn" title="새 게임">↻</button>
        </div>

    </header>


    <main class="layout">

        <!-- LEFT -->

        <aside class="sidebar left-sidebar">

            <div class="panel profile-card">

                <div id="bigAvatar" class="big-avatar">
                    👶
                </div>

                <div id="playerName" class="player-name">
                    -
                </div>

                <div id="playerAge" class="player-age">
                    1살
                </div>

            </div>


            <div class="panel">

                <div class="panel-title">
                    MY STATUS
                </div>

                <div id="statsBox"></div>

            </div>


            <div class="panel">

                <div class="panel-title">
                    RELATIONSHIPS
                </div>

                <div id="npcList" class="npc-list"></div>

            </div>

        </aside>


        <!-- CENTER -->

        <section class="chat-panel">

            <div class="scene-header">

                <div id="sceneLabel" class="scene-label">
                    LIFE / AGE 1
                </div>

                <div id="sceneTitle" class="scene-title">
                    어느 봄날
                </div>

                <div id="sceneSub" class="scene-sub">
                    당신의 이야기가 시작된다.
                </div>

            </div>


            <div id="chatArea" class="chat-area"></div>


            <div class="choice-area">

                <div class="choice-hint">
                    선택지를 누르면 약 0.5초 후 다음 대화가 이어집니다.
                </div>

                <div id="choices" class="choices"></div>

                <div class="free-input">

                    <input
                        id="freeInput"
                        placeholder="직접 말하기... (선택)"
                        maxlength="100"
                    >

                    <button id="freeSend">
                        ↗
                    </button>

                </div>

            </div>

        </section>


        <!-- RIGHT -->

        <aside class="sidebar right-sidebar">

            <div class="panel">

                <div class="panel-title">
                    LIFE LOG
                </div>

                <div id="lifeLog" class="log-list"></div>

            </div>


            <div class="panel">

                <div class="panel-title">
                    CURRENT QUEST
                </div>

                <div id="questBox" class="quest">
                    이야기를 시작해보자.
                </div>

            </div>


            <div class="panel">

                <div class="panel-title">
                    ACHIEVEMENTS
                </div>

                <div id="badges" class="badges"></div>

            </div>

        </aside>

    </main>

</section>


<!-- END -->

<div id="endScreen" class="end-screen hidden">

    <div class="end-box">

        <div id="endIcon" class="end-icon">
            🌅
        </div>

        <h1 id="endTitle">
            ENDING
        </h1>

        <p id="endDescription">
            -
        </p>

        <div id="endStats" class="end-stats"></div>

        <div class="end-buttons">

            <button
                id="closeEnd"
                class="close-end"
            >
                기록 보기
            </button>

            <button
                id="restartEnd"
                class="restart"
            >
                다시 태어나기
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   LIFE RPG
   CORE DATA
========================================================= */

const STORAGE_KEY = "LIFE_RPG_COMPLETE_V1";

const defaultGame = {

    started:false,

    name:"",

    avatar:"",

    family:"warm",

    personality:"curious",

    age:1,

    sceneIndex:0,

    currentScene:null,

    locked:false,

    finished:false,

    stats:{
        intelligence:10,
        creativity:10,
        empathy:10,
        courage:10,
        charm:10,
        luck:10,
        happiness:70,
        money:0
    },

    relationships:{
        mom:{
            name:"엄마",
            affinity:70,
            trust:65
        },

        dad:{
            name:"아빠",
            affinity:65,
            trust:60
        },

        grandma:{
            name:"할머니",
            affinity:60,
            trust:55
        },

        friend:{
            name:"아직 없음",
            affinity:0,
            trust:0
        },

        rival:{
            name:"아직 없음",
            affinity:0,
            trust:0
        }
    },

    memories:[],

    badges:[],

    flags:{},

    log:[],

    completedAges:[]

};


/* =========================================================
   GLOBAL
========================================================= */

let G = structuredClone(defaultGame);

let avatarData = "";

let age1Scenes = [];

let currentChoices = [];


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   START OPTIONS
========================================================= */

document.querySelectorAll(".start-option").forEach(btn => {

    btn.addEventListener("click",()=>{

        const type = btn.dataset.type;

        document
            .querySelectorAll(`.start-option[data-type="${type}"]`)
            .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        if(type==="family"){
            G.family = btn.dataset.value;
        }

        if(type==="personality"){
            G.personality = btn.dataset.value;
        }

    });

});


/* =========================================================
   AVATAR
========================================================= */

$("avatarInput").addEventListener("change",function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        avatarData = reader.result;

        $("avatarPreview").innerHTML =
            `<img src="${avatarData}">`;

    };

    reader.readAsDataURL(file);

});


/* =========================================================
   START GAME
========================================================= */

$("startButton").addEventListener("click",()=>{

    const name =
        $("nameInput").value.trim() || "유진";

    G = structuredClone(defaultGame);

    G.started = true;

    G.name = name;

    G.avatar = avatarData;

    startGame();

});


function startGame(){

    $("startScreen").style.display="none";
    $("gameScreen").style.display="block";

    $("playerName").textContent = G.name;

    if(G.avatar){

        $("bigAvatar").innerHTML =
            `<img src="${G.avatar}">`;

    }

    applyStartBonuses();

    buildAge1Scenes();

    G.sceneIndex = 0;

    renderAll();

    loadScene();

}


/* =========================================================
   START BONUS
========================================================= */

function applyStartBonuses(){

    if(G.personality==="curious"){

        G.stats.creativity += 4;
        G.stats.intelligence += 3;

    }

    if(G.personality==="calm"){

        G.stats.empathy += 4;
        G.stats.luck += 2;

    }

    if(G.personality==="bold"){

        G.stats.courage += 5;
        G.stats.charm += 2;

    }

    if(G.family==="warm"){

        G.relationships.mom.affinity += 8;
        G.relationships.dad.affinity += 8;

    }

    if(G.family==="busy"){

        G.stats.independence =
            (G.stats.independence || 0)+4;

    }

    if(G.family==="free"){

        G.stats.creativity += 4;
        G.stats.courage += 2;

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function addMessage(type,npc,text){

    const area = $("chatArea");

    const wrap = document.createElement("div");

    wrap.className =
        "message " + (type==="me" ? "me" : "");

    let avatar = "";

    let displayName = "";

    if(type==="me"){

        displayName = G.name;

        avatar = G.avatar
            ? `<img src="${G.avatar}">`
            : "👶";

    }else{

        const data = getNPC(npc);

        displayName = data.name;

        avatar = data.avatar
            ? `<img src="${data.avatar}">`
            : data.emoji;

    }

    wrap.innerHTML = `

        <div class="message-avatar">
            ${avatar}
        </div>

        <div class="message-body">

            <div class="message-name">
                ${escapeHTML(displayName)}
            </div>

            <div class="bubble">
                ${escapeHTML(text)}
            </div>

        </div>
    `;

    area.appendChild(wrap);

    area.scrollTop = area.scrollHeight;

}

/* =========================================================
   SCENE LOADING
========================================================= */

function loadScene(){

    if(G.sceneIndex >= age1Scenes.length){

        completeAge1();

        return;
    }

    const scene = age1Scenes[G.sceneIndex];

    G.currentScene = scene;

    $("sceneLabel").textContent = scene.label;

    $("sceneTitle").textContent = scene.title;

    $("sceneSub").textContent = scene.sub;

    $("questBox").textContent = scene.quest;

    currentChoices = scene.choices;

    renderChoices(currentChoices);

    scene.messages.forEach((m,index)=>{

        setTimeout(()=>{

            addMessage(
                "npc",
                m.npc,
                m.text
            );

        }, index*650);

    });

    G.locked = false;

    updateLog(
        `새로운 장면: ${scene.title}`
    );

}


/* =========================================================
   CHOICE
========================================================= */

function chooseChoice(choice){

    if(G.locked) return;

    G.locked = true;

    disableChoices();

    G.lastAction = choice.action;

    G.lastChoiceText = choice.text;

    addMessage(
        "me",
        null,
        choice.text
    );

    applyEffects(choice.effects || {});

    addMemory(
        `${G.age}살 · ${choice.text}`
    );

    setTimeout(()=>{

        showTyping();

        setTimeout(()=>{

            hideTyping();

            playResponses(
                choice.responses || [],
                ()=>{
                    finishChoice(choice);
                }
            );

        },500);

    },500);

}


/* =========================================================
   RESPONSES
========================================================= */

function playResponses(responses,done){

    if(!responses.length){

        done();
        return;
    }

    let i=0;

    function next(){

        if(i>=responses.length){

            done();
            return;
        }

        showTyping();

        setTimeout(()=>{

            hideTyping();

            addMessage(
                "npc",
                responses[i].npc,
                responses[i].text
            );

            i++;

            setTimeout(next,450);

        },500);

    }

    next();

}


/* =========================================================
   FINISH CHOICE
========================================================= */

function finishChoice(choice){

    if(choice.next && choice.next.length){

        currentChoices = choice.next;

        renderChoices(choice.next);

        G.locked = false;

        return;
    }

    setTimeout(()=>{

        G.sceneIndex++;

        if(G.sceneIndex < age1Scenes.length){

            loadScene();

        }else{

            completeAge1();

        }

    },550);

}


/* =========================================================
   RENDER CHOICES
========================================================= */

function renderChoices(choices){

    const box = $("choices");

    box.innerHTML="";

    if(!choices || !choices.length){

        return;
    }

    choices.forEach((choice,index)=>{

        const btn = document.createElement("button");

        btn.className="choice-btn";

        btn.innerHTML =
            `<b>${index+1}.</b> ${escapeHTML(choice.text)}`;

        btn.addEventListener(
            "click",
            ()=>chooseChoice(choice)
        );

        box.appendChild(btn);

    });

}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

    hideTyping();

    const area = $("chatArea");

    const typing = document.createElement("div");

    typing.className="typing";

    typing.id="typingIndicator";

    typing.innerHTML=`

        <div class="message-avatar">
            💬
        </div>

        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    area.appendChild(typing);

    area.scrollTop=area.scrollHeight;

}


function hideTyping(){

    const x = $("typingIndicator");

    if(x) x.remove();

}


/* =========================================================
   DISABLE
========================================================= */

function disableChoices(){

    document
        .querySelectorAll(".choice-btn")
        .forEach(btn=>{
            btn.disabled=true;
        });

}


/* =========================================================
   EFFECTS
========================================================= */

function applyEffects(effects){

    Object.entries(effects).forEach(([key,value])=>{

        if(key in G.stats){

            G.stats[key] += value;

            if(key!=="money"){

                G.stats[key] =
                    Math.max(
                        0,
                        Math.min(100,G.stats[key])
                    );

            }

            if(key==="money"){

                G.stats.money =
                    Math.max(0,G.stats.money);

            }

        }

    });

    updateRelationshipFromActions();

    checkAchievements();

    renderStats();

}


/* =========================================================
   RELATIONSHIP
========================================================= */

function updateRelationshipFromActions(){

    const action = G.lastAction;

    const relationMap = {

        look_mom:["mom",2,1],
        smile_mom:["mom",3,2],
        reach:["mom",1,0],

        hug_mom:["mom",4,2],
        hug_mom_rain:["mom",4,2],
        hold_mom:["mom",3,2],
        night_mom:["mom",4,2],

        say_mom:["mom",7,5],

        say_dad:["dad",7,5],

        hug_grandma:["grandma",5,4],
        approach_grandma:["grandma",2,2],
        laugh_grandma:["grandma",4,3],

        return_ball:["friend",5,4],
        smile_friend:["friend",4,3],
        wave_friend:["friend",3,2],
        watch_friend:["friend",1,1],

        keep_ball:["friend",-4,-2],

        hide_friend:["friend",0,1]

    };

    if(relationMap[action]){

        const [id,a,t] =
            relationMap[action];

        if(G.relationships[id]){

            G.relationships[id].affinity =
                Math.max(
                    0,
                    Math.min(
                        100,
                        G.relationships[id].affinity+a
                    )
                );

            G.relationships[id].trust =
                Math.max(
                    0,
                    Math.min(
                        100,
                        G.relationships[id].trust+t
                    )
                );

        }

    }

}


/* =========================================================
   AGE COMPLETE
========================================================= */

function completeAge1(){

    if(G.completedAges.includes(1)){

        showEnd();

        return;
    }

    G.completedAges.push(1);

    G.age=2;

    G.sceneIndex=0;

    G.log.push({
        age:1,
        text:"🎂 첫 번째 생일을 지나 2살이 되었다."
    });

    addBadge("🌱 첫 번째 인생");

    addMessage(
        "npc",
        "mom",
        "벌써 두 살이네."
    );

    setTimeout(()=>{

        addMessage(
            "npc",
            "dad",
            "앞으로도 재미있는 일들이 많을 거야."
        );

    },650);

    setTimeout(()=>{

        startAge2();

    },1500);

}


/* =========================================================
   AGE 2+
   STRUCTURED SCENE ENGINE
========================================================= */

function startAge2(){

    const scenes = getAgeScenes(G.age);

    if(!scenes.length){

        G.age=G.age+1;

        startAge2();

        return;
    }

    age1Scenes = scenes;

    G.sceneIndex=0;

    loadScene();

}

/* =========================================================
   SCENE HELPERS
========================================================= */

function direct(text,action,effects,responses,next=[]){

    const obj = {

        text,
        action,
        effects,
        responses:responses.map(x=>({
            npc:x[0],
            text:x[1]
        }))

    };

    if(next && next.length){

        obj.next=next;

    }

    return obj;

}


function simpleScene(
    label,
    title,
    sub,
    npc,
    npcText,
    quest,
    choices
){

    return {

        label,
        title,
        sub,

        messages:[
            {
                npc,
                text:npcText
            }
        ],

        quest,

        choices

    };

}


/* =========================================================
   FREE TEXT
========================================================= */

$("freeSend").addEventListener(
    "click",
    sendFreeText
);

$("freeInput").addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter"){
            sendFreeText();
        }
    }
);


function sendFreeText(){

    if(G.locked) return;

    const input =
        $("freeInput");

    const text =
        input.value.trim();

    if(!text) return;

    input.value="";

    G.locked=true;

    disableChoices();

    addMessage(
        "me",
        null,
        text
    );

    addMemory(
        `${G.age}살 · 직접 말함: ${text}`
    );

    setTimeout(()=>{

        showTyping();

        setTimeout(()=>{

            hideTyping();

            const response =
                getFreeResponse(text);

            addMessage(
                "npc",
                response.npc,
                response.text
            );

            setTimeout(()=>{

                G.locked=false;

                renderChoices(currentChoices);

            },500);

        },500);

    },500);

}


/* =========================================================
   FREE TEXT REACTION
   ONLY FOR OPTIONAL FREE INPUT
   NOT USED FOR CHOICES
========================================================= */

function getFreeResponse(text){

    const t=text.toLowerCase();

    if(
        t.includes("엄마") ||
        t.includes("사랑")
    ){

        return {
            npc:"mom",
            text:"응. 엄마 여기 있어. 네가 무슨 말을 하든 들어줄게."
        };

    }

    if(
        t.includes("아빠")
    ){

        return {
            npc:"dad",
            text:"그래. 아빠도 듣고 있어."
        };

    }

    if(
        t.includes("싫어")
    ){

        return {
            npc:"mom",
            text:"싫다고 말할 수도 있어. 네 마음부터 이야기해줘."
        };

    }

    if(
        t.includes("좋아")
    ){

        return {
            npc:"mom",
            text:"좋아? 그럼 같이 해보자."
        };

    }

    return {

        npc:"mom",
        text:"응. 네가 그렇게 생각했구나. 엄마가 듣고 있어."

    };

}

function addMemory(text){

    G.memories.unshift({
        age:G.age,
        text
    });

    if(G.memories.length>100){

        G.memories.pop();

    }

    renderLog();

}


function updateLog(text){

    G.log.unshift({
        age:G.age,
        text
    });

    if(G.log.length>60){

        G.log.pop();

    }

    renderLog();

}

function renderStats(){

    const names = {

        intelligence:["🧠","지능"],

        creativity:["🎨","창의력"],

        empathy:["💗","공감"],

        courage:["⚡","용기"],

        charm:["✨","매력"],

        luck:["🍀","행운"],

        happiness:["☀️","행복"]

    };

    const box = $("statsBox");

    box.innerHTML="";

    Object.entries(names).forEach(([key,data])=>{

        const value =
            Math.max(
                0,
                Math.min(
                    100,
                    G.stats[key] || 0
                )
            );

        box.innerHTML += `

            <div class="stat">

                <div class="stat-head">
                    <span>${data[0]} ${data[1]}</span>
                    <b>${value}</b>
                </div>

                <div class="stat-bar">
                    <div
                        class="stat-fill"
                        style="width:${value}%"
                    ></div>
                </div>

            </div>

        `;

    });

    box.innerHTML += `

        <div class="stat">

            <div class="stat-head">

                <span>💰 돈</span>

                <b>
                    ₩${Math.max(
                        0,
                        G.stats.money
                    ).toLocaleString()}
                </b>

            </div>

        </div>
    `;

}


function renderNPCs(){

    const box=$("npcList");

    box.innerHTML="";

    Object.entries(G.relationships)
    .forEach(([id,r])=>{

        let name = r.name;

        if(
            id==="friend" &&
            r.affinity>0
        ){
            name="첫 번째 친구";
        }

        box.innerHTML += `

            <div class="npc-item">

                <div class="npc-mini">
                    ${getNPC(id).emoji}
                </div>

                <div class="npc-info">

                    <div class="npc-name">
                        ${name}
                    </div>

                    <div class="npc-rel">
                        친밀도 ${r.affinity}
                        · 신뢰 ${r.trust}
                    </div>

                </div>

            </div>

        `;

    });

}


function renderLog(){

    const box=$("lifeLog");

    box.innerHTML="";

    const data = [
        ...G.log,
        ...G.memories
    ].slice(0,30);

    if(!data.length){

        box.innerHTML =
            `<div style="color:#aaa;font-size:11px">
                아직 기록이 없어.
            </div>`;

        return;
    }

    data.forEach(item=>{

        box.innerHTML += `

            <div class="log-item">

                <span class="log-age">
                    ${item.age}살
                </span>

                ${escapeHTML(item.text)}

            </div>

        `;

    });

}


function renderBadges(){

    const box=$("badges");

    box.innerHTML="";

    if(!G.badges.length){

        box.innerHTML =
            `<span style="font-size:11px;color:#aaa">
                아직 획득한 배지가 없어.
            </span>`;

        return;

    }

    G.badges.forEach(b=>{

        box.innerHTML +=
            `<span class="badge">
                ${escapeHTML(b)}
            </span>`;

    });

}

        if(G.age===1){

            age1Scenes=age1Scenes;

        }else{

            age1Scenes=getAgeScenes(G.age);

        }

        renderAll();

        $("chatArea").innerHTML="";

        addMessage(
            "npc",
            "mom",
            "저장된 인생 기록을 불러왔어."
        );

        setTimeout(()=>{

            loadScene();

        },600);

    }catch(e){

        alert("저장 기록을 불러오지 못했어.");

    }

});

/* =========================================================
   ENDING SYSTEM
   30+ DIFFERENT ENDINGS
========================================================= */

function calculateEnding(){

    const s=G.stats;

    const e=G.relationships;

    const total =
        s.intelligence+
        s.creativity+
        s.empathy+
        s.courage+
        s.charm+
        s.luck+
        s.happiness;

    const relationships =
        e.mom.affinity+
        e.dad.affinity+
        e.grandma.affinity+
        e.friend.affinity;

    const endings=[

        {
            min:0,
            title:"🌱 조용한 삶",
            desc:"크게 요란하지는 않았지만, 너만의 방식으로 하루하루를 살아왔다."
        },

        {
            min:15,
            title:"📖 이야기 수집가",
            desc:"많은 사건보다도 그 순간의 의미를 기억하는 사람이 되었다."
        },

        {
            min:25,
            title:"🏡 따뜻한 집",
            desc:"사람들과 함께하는 시간을 소중하게 여기며 살아왔다."
        },

        {
            min:35,
            title:"🎨 창작자의 삶",
            desc:"상상했던 것들을 현실로 만들어내는 삶을 선택했다."
        },

        {
            min:45,
            title:"⚡ 도전하는 사람",
            desc:"새로운 길 앞에서 여러 번 망설였지만 결국 직접 움직였다."
        },

        {
            min:55,
            title:"✨ 사람을 끌어당기는 사람",
            desc:"어디에 있든 주변에 사람들이 모였고 많은 인연이 남았다."
        },

        {
            min:65,
            title:"🧠 평생 배우는 사람",
            desc:"나이가 들어도 궁금한 것을 그냥 지나치지 않았다."
        },

        {
            min:75,
            title:"🌳 느린 행복",
            desc:"빠르게 달리는 것보다 오래 지속되는 행복을 선택했다."
        },

        {
            min:85,
            title:"🌅 긴 여행",
            desc:"돌아보니 인생은 하나의 긴 여행과도 같았다."
        },

        {
            min:100,
            title:"💫 수많은 선택",
            desc:"수많은 선택들이 연결되어 지금의 너를 만들었다."
        }

    ];

    let selected=endings[0];

    endings.forEach(x=>{

        if(total>=x.min){

            selected=x;

        }

    });

    if(
        s.creativity>=70 &&
        s.courage>=65
    ){

        selected={
            title:"🎬 내가 만든 이야기",
            desc:"남이 정해준 역할보다 스스로 만든 이야기를 선택했다."
        };

    }

    if(
        s.empathy>=70 &&
        relationships>=240
    ){

        selected={
            title:"❤️ 사람의 기억",
            desc:"네가 남긴 가장 큰 흔적은 성취보다 사람들이었다."
        };

    }

    if(
        s.intelligence>=75 &&
        s.creativity>=65
    ){

        selected={
            title:"💡 끝없는 아이디어",
            desc:"평생 새로운 생각을 만들고 세상에 남겼다."
        };

    }

    if(
        s.courage>=80 &&
        s.happiness>=70
    ){

        selected={
            title:"🚀 멈추지 않은 사람",
            desc:"두려움이 없는 삶이 아니라, 두려워도 움직이는 삶을 살았다."
        };

    }

    if(
        s.happiness>=90 &&
        relationships>=250
    ){

        selected={
            title:"☀️ 행복의 기록",
            desc:"마지막에 돌아본 것은 얼마나 많이 가졌는지가 아니라 얼마나 많이 웃었는지였다."
        };

    }

    return selected;

}


/* =========================================================
   END SCREEN
========================================================= */

function showEnd(){

    const ending =
        calculateEnding();

    $("endIcon").textContent =
        ending.title.split(" ")[0];

    $("endTitle").textContent =
        ending.title.substring(
            ending.title.indexOf(" ")+1
        );

    $("endDescription").textContent =
        ending.desc;

    $("endStats").innerHTML=`

        <div class="end-stat">
            행복
            <b>${G.stats.happiness}</b>
        </div>

        <div class="end-stat">
            지능
            <b>${G.stats.intelligence}</b>
        </div>

        <div class="end-stat">
            창의력
            <b>${G.stats.creativity}</b>
        </div>

        <div class="end-stat">
            공감
            <b>${G.stats.empathy}</b>
        </div>

        <div class="end-stat">
            용기
            <b>${G.stats.courage}</b>
        </div>

        <div class="end-stat">
            매력
            <b>${G.stats.charm}</b>
        </div>

    `;

    $("endScreen")
        .classList
        .remove("hidden");

}

/* =========================================================
   KEYBOARD CHOICES
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(G.locked) return;

        const num =
            Number(e.key);

        if(
            num>=1 &&
            num<=9 &&
            currentChoices[num-1]
        ){

            chooseChoice(
                currentChoices[num-1]
            );

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
