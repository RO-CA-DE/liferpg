<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE RPG : ROLEPLAY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans KR",sans-serif;
    background:#08090d;
    color:#f5f5f7;
    min-height:100vh;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= START ================= */

#startScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,#303657 0,transparent 30%),
        radial-gradient(circle at 80% 70%,#3b244d 0,transparent 28%),
        #08090d;
}

.startBox{
    width:850px;
    padding:55px;
    border:1px solid #343746;
    border-radius:30px;
    background:rgba(18,20,29,.94);
    box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.logo{
    font-size:46px;
    font-weight:900;
    letter-spacing:-3px;
}

.logo span{
    color:#9b8cff;
}

.subtitle{
    margin-top:10px;
    color:#a7a9b7;
    font-size:16px;
}

.startGrid{
    margin-top:45px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    background:#11131b;
    border:1px solid #292c39;
    border-radius:16px;
    padding:18px;
}

.field label{
    display:block;
    color:#898d9e;
    font-size:13px;
    margin-bottom:10px;
}

.field input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:18px;
}

.choiceRow{
    display:flex;
    gap:10px;
}

.birthChoice{
    flex:1;
    padding:13px;
    background:#171923;
    color:#aaa;
    border:1px solid #2e3140;
    border-radius:12px;
}

.birthChoice.selected{
    background:#7063d8;
    color:white;
    border-color:#9489ff;
}

.startBtn{
    width:100%;
    margin-top:25px;
    padding:18px;
    border:0;
    border-radius:16px;
    background:#fff;
    color:#08090d;
    font-size:18px;
    font-weight:800;
}

.startBtn:hover{
    background:#dcd8ff;
}

/* ================= GAME ================= */

#game{
    width:1500px;
    max-width:96vw;
    height:94vh;
    margin:3vh auto;
    display:grid;
    grid-template-columns:280px minmax(600px,1fr) 290px;
    gap:14px;
}

.panel{
    background:#11131a;
    border:1px solid #292c37;
    border-radius:20px;
    overflow:hidden;
}

/* LEFT */

.leftPanel{
    display:flex;
    flex-direction:column;
}

.profile{
    padding:24px;
    border-bottom:1px solid #292c37;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:25px;
    background:linear-gradient(135deg,#7166d9,#b19cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    margin-bottom:16px;
}

.profileName{
    font-size:23px;
    font-weight:800;
}

.profileSub{
    color:#8d91a2;
    margin-top:5px;
}

.nav{
    padding:12px;
}

.nav button{
    width:100%;
    padding:13px;
    margin-bottom:7px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#999dac;
    text-align:left;
}

.nav button:hover,
.nav button.active{
    background:#202330;
    color:white;
}

.npcTitle{
    padding:15px 20px;
    color:#777b8b;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.npcList{
    overflow:auto;
    padding:0 12px 15px;
}

.npc{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px;
    border-radius:12px;
    margin-bottom:5px;
}

.npc:hover{
    background:#1b1e28;
}

.npcAvatar{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#272a38;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.npcInfo{
    min-width:0;
}

.npcName{
    font-weight:bold;
    font-size:14px;
}

.npcRelation{
    color:#737789;
    font-size:11px;
    margin-top:3px;
}

/* CENTER */

.center{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.sceneTop{
    padding:18px 23px;
    border-bottom:1px solid #292c37;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.location{
    font-weight:bold;
}

.time{
    color:#858999;
    font-size:13px;
}

.story{
    flex:1;
    overflow:auto;
    padding:35px 42px 20px;
    background:
        radial-gradient(circle at 50% 0%,rgba(120,108,220,.09),transparent 40%);
}

.chapter{
    color:#8983d8;
    font-size:12px;
    letter-spacing:1px;
    font-weight:bold;
    margin-bottom:10px;
}

.sceneTitle{
    font-size:31px;
    font-weight:900;
    letter-spacing:-1.5px;
    margin-bottom:25px;
}

.narration{
    color:#b9bbc5;
    line-height:1.9;
    font-size:15px;
    margin:16px 0;
}

.dialogue{
    display:flex;
    gap:14px;
    margin:22px 0;
}

.dialogue.me{
    flex-direction:row-reverse;
}

.dialogueAvatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#282b39;
    font-size:22px;
}

.dialogueBody{
    max-width:72%;
}

.speaker{
    color:#9d99e9;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.bubble{
    background:#1d202b;
    border:1px solid #2d303d;
    padding:14px 17px;
    border-radius:4px 16px 16px 16px;
    line-height:1.65;
}

.me .bubble{
    background:#6259ba;
    border-color:#7066d5;
    border-radius:16px 4px 16px 16px;
}

.systemMsg{
    margin:22px auto;
    max-width:80%;
    text-align:center;
    color:#878b9d;
    font-size:12px;
    padding:10px;
    border-top:1px solid #272a35;
    border-bottom:1px solid #272a35;
}

.inputArea{
    padding:16px;
    border-top:1px solid #292c37;
    background:#0f1117;
}

.quickChoices{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.choiceBtn{
    padding:10px 13px;
    border:1px solid #343746;
    background:#191c25;
    color:#c5c7d0;
    border-radius:10px;
}

.choiceBtn:hover{
    background:#292d3c;
    color:white;
}

.inputRow{
    display:flex;
    gap:9px;
}

#playerInput{
    flex:1;
    min-height:48px;
    resize:none;
    border:1px solid #323543;
    outline:none;
    background:#181a22;
    color:white;
    border-radius:13px;
    padding:13px 15px;
}

#sendBtn{
    width:105px;
    border:0;
    border-radius:13px;
    background:white;
    color:#111;
    font-weight:800;
}

#sendBtn:hover{
    background:#d9d5ff;
}

/* RIGHT */

.rightPanel{
    overflow:auto;
}

.statusHead{
    padding:22px;
    border-bottom:1px solid #292c37;
    font-weight:bold;
}

.statBox{
    padding:20px;
}

.stat{
    margin-bottom:18px;
}

.statTop{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:7px;
    color:#a8aab6;
}

.bar{
    height:6px;
    background:#242733;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#8175ed;
    border-radius:20px;
}

.memory{
    margin:15px;
    padding:14px;
    background:#191c25;
    border-radius:13px;
    color:#a8abb8;
    font-size:12px;
    line-height:1.7;
}

.logTitle{
    padding:15px 20px 8px;
    color:#777b8b;
    font-size:11px;
    letter-spacing:1px;
}

.log{
    padding:0 15px 20px;
}

.logItem{
    font-size:11px;
    color:#858997;
    padding:8px 4px;
    border-bottom:1px solid #20232d;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.modal{
    width:650px;
    max-width:90vw;
    max-height:85vh;
    overflow:auto;
    background:#151720;
    border:1px solid #373a48;
    border-radius:24px;
    padding:28px;
}

.modal h2{
    margin-bottom:18px;
}

.modal p{
    color:#aeb0bc;
    line-height:1.8;
}

.modal button{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    background:white;
}

/* ending */

.endingBox{
    text-align:center;
    width:750px;
    padding:55px;
    background:#14161f;
    border:1px solid #373a48;
    border-radius:25px;
}

.endingTitle{
    font-size:40px;
    font-weight:900;
    margin:20px 0;
}

.endingText{
    color:#b5b7c2;
    line-height:1.9;
}

@media(max-width:1100px){
    #game{
        grid-template-columns:220px 1fr;
        height:auto;
    }

    .rightPanel{
        display:none;
    }
}

@media(max-width:750px){
    #game{
        width:100%;
        max-width:none;
        margin:0;
        display:block;
    }

    .leftPanel{
        display:none;
    }

    .center{
        height:100vh;
    }

    .story{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen">
    <div class="startBox">

        <div class="logo">LIFE <span>RPG</span></div>
        <div class="subtitle">
            ROLEPLAY — 네가 직접 살아가는 이야기
        </div>

        <div class="startGrid">

            <div class="field">
                <label>이름</label>
                <input id="nameInput" placeholder="주인공 이름을 입력해줘">
            </div>

            <div class="field">
                <label>성격</label>
                <div class="choiceRow">
                    <button class="birthChoice selected" data-personality="free">자유로운</button>
                    <button class="birthChoice" data-personality="calm">차분한</button>
                    <button class="birthChoice" data-personality="bold">대담한</button>
                </div>
            </div>

            <div class="field">
                <label>가정환경</label>
                <div class="choiceRow">
                    <button class="birthChoice selected" data-family="normal">평범한 가족</button>
                    <button class="birthChoice" data-family="rich">넉넉한 가족</button>
                    <button class="birthChoice" data-family="poor">검소한 가족</button>
                </div>
            </div>

            <div class="field">
                <label>특성</label>
                <div class="choiceRow">
                    <button class="birthChoice selected" data-trait="lucky">운이 좋음</button>
                    <button class="birthChoice" data-trait="creative">창의적</button>
                    <button class="birthChoice" data-trait="social">사교적</button>
                </div>
            </div>

        </div>

        <button class="startBtn" onclick="startGame()">인생을 시작하기 →</button>

    </div>
</div>


<!-- GAME -->
<div id="game" class="hidden">

    <!-- LEFT -->
    <aside class="panel leftPanel">

        <div class="profile">
            <div class="avatar" id="playerAvatar">🙂</div>
            <div class="profileName" id="profileName">주인공</div>
            <div class="profileSub" id="profileSub">17세 · 학생</div>
        </div>

        <div class="nav">
            <button class="active" onclick="showTab('story')">◉ 이야기</button>
            <button onclick="showMemories()">▣ 기억</button>
            <button onclick="showCharacter()">♙ 내 캐릭터</button>
            <button onclick="saveGame()">↓ 저장</button>
            <button onclick="loadGame()">↑ 불러오기</button>
        </div>

        <div class="npcTitle">CURRENT CHARACTERS</div>
        <div class="npcList" id="npcList"></div>

    </aside>


    <!-- CENTER -->
    <main class="panel center">

        <div class="sceneTop">
            <div class="location" id="location">서울 ○○고등학교</div>
            <div class="time" id="time">월요일 · 오전 8:10</div>
        </div>

        <div class="story" id="story">
        </div>

        <div class="inputArea">

            <div class="quickChoices" id="quickChoices"></div>

            <div class="inputRow">
                <textarea
                    id="playerInput"
                    placeholder="네가 직접 말하거나 행동을 입력해봐..."
                ></textarea>

                <button id="sendBtn" onclick="sendPlayerInput()">보내기</button>
            </div>

        </div>

    </main>


    <!-- RIGHT -->
    <aside class="panel rightPanel">

        <div class="statusHead">CHARACTER STATUS</div>

        <div class="statBox">

            <div class="stat">
                <div class="statTop">
                    <span>✨ 매력</span>
                    <span id="sCharm">72</span>
                </div>
                <div class="bar"><div class="fill" id="bCharm"></div></div>
            </div>

            <div class="stat">
                <div class="statTop">
                    <span>🧠 지능</span>
                    <span id="sInt">65</span>
                </div>
                <div class="bar"><div class="fill" id="bInt"></div></div>
            </div>

            <div class="stat">
                <div class="statTop">
                    <span>💪 체력</span>
                    <span id="sHealth">70</span>
                </div>
                <div class="bar"><div class="fill" id="bHealth"></div></div>
            </div>

            <div class="stat">
                <div class="statTop">
                    <span>🎨 창의성</span>
                    <span id="sCreative">68</span>
                </div>
                <div class="bar"><div class="fill" id="bCreative"></div></div>
            </div>

            <div class="stat">
                <div class="statTop">
                    <span>🍀 운</span>
                    <span id="sLuck">75</span>
                </div>
                <div class="bar"><div class="fill" id="bLuck"></div></div>
            </div>

            <div class="stat">
                <div class="statTop">
                    <span>❤️ 행복</span>
                    <span id="sHappy">70</span>
                </div>
                <div class="bar"><div class="fill" id="bHappy"></div></div>
            </div>

        </div>

        <div class="memory" id="currentMemory">
            아직 특별한 기억이 없다.
        </div>

        <div class="logTitle">LIFE LOG</div>
        <div class="log" id="lifeLog"></div>

    </aside>

</div>


<!-- MODAL -->
<div id="modal" class="overlay hidden">
    <div class="modal" id="modalContent"></div>
</div>


<!-- ENDING -->
<div id="endingScreen" class="overlay hidden">
    <div class="endingBox">
        <div>✦ LIFE COMPLETE ✦</div>
        <div class="endingTitle" id="endingTitle"></div>
        <div class="endingText" id="endingText"></div>
        <button onclick="location.reload()">새로운 인생 시작</button>
    </div>
</div>


<script>

/* =========================================================
   GAME DATA
========================================================= */

let game = {
    name:"",
    age:17,
    day:1,
    month:3,
    time:"오전 8:10",

    personality:"free",
    family:"normal",
    trait:"lucky",

    location:"서울 ○○고등학교",
    chapter:"고등학교",

    stats:{
        charm:72,
        intelligence:65,
        health:70,
        creative:68,
        luck:75,
        happiness:70,
        money:12000,
        fame:0
    },

    relationships:{
        minji:{
            name:"한민지",
            avatar:"👩🏻",
            role:"소꿉친구",
            relation:"친한 친구",
            affinity:70,
            trust:65,
            jealousy:5,
            mood:"평온",
            memories:[]
        },

        dohyun:{
            name:"강도현",
            avatar:"👦🏻",
            role:"반 친구",
            relation:"친구",
            affinity:48,
            trust:45,
            jealousy:0,
            mood:"보통",
            memories:[]
        },

        jiwon:{
            name:"이준혁",
            avatar:"🧑🏻",
            role:"전학생",
            relation:"아직 모름",
            affinity:25,
            trust:20,
            jealousy:0,
            mood:"긴장",
            memories:[]
        },

        teacher:{
            name:"박서현",
            avatar:"👩🏻‍🏫",
            role:"담임 선생님",
            relation:"학생",
            affinity:45,
            trust:50,
            jealousy:0,
            mood:"차분",
            memories:[]
        },

        mother:{
            name:"엄마",
            avatar:"👩🏻",
            role:"가족",
            relation:"엄마",
            affinity:85,
            trust:90,
            jealousy:0,
            mood:"평온",
            memories:[]
        },

        father:{
            name:"아빠",
            avatar:"👨🏻",
            role:"가족",
            relation:"아빠",
            affinity:80,
            trust:80,
            jealousy:0,
            mood:"평온",
            memories:[]
        }
    },

    flags:{
        metTransfer:false,
        helpedMinji:false,
        foughtDohyun:false,
        joinedClub:false,
        festival:false,
        secretKnown:false,
        confession:false,
        dating:false,
        brokeUp:false,
        graduation:false,
        dreamChosen:false
    },

    memories:[],
    log:[],
    sceneIndex:0,
    currentScene:null
};

let selectedPersonality="free";
let selectedFamily="normal";
let selectedTrait="lucky";


/* =========================================================
   START
========================================================= */

document.querySelectorAll("[data-personality]").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll("[data-personality]").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedPersonality=btn.dataset.personality;
    };
});

document.querySelectorAll("[data-family]").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll("[data-family]").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedFamily=btn.dataset.family;
    };
});

document.querySelectorAll("[data-trait]").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll("[data-trait]").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedTrait=btn.dataset.trait;
    };
});


function startGame(){

    const name=document.getElementById("nameInput").value.trim();

    if(!name){
        alert("주인공 이름을 입력해줘!");
        return;
    }

    game.name=name;
    game.personality=selectedPersonality;
    game.family=selectedFamily;
    game.trait=selectedTrait;

    if(selectedTrait==="creative") game.stats.creative+=12;
    if(selectedTrait==="social") game.stats.charm+=10;
    if(selectedTrait==="lucky") game.stats.luck+=15;

    if(selectedFamily==="rich"){
        game.stats.money=50000;
    }

    if(selectedFamily==="poor"){
        game.stats.money=5000;
        game.stats.happiness-=5;
    }

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    document.getElementById("profileName").textContent=game.name;

    renderNPCs();
    updateStats();
    addLog("인생 RPG가 시작되었다.");
    loadScene("opening");

}


/* =========================================================
   STORY ENGINE
========================================================= */

const scenes={

opening:{
    chapter:"CHAPTER 01 · 새로운 학기",
    title:"3월의 첫날",
    location:"서울 ○○고등학교 · 2학년 교실",
    time:"월요일 · 오전 8:10",

    content:[
        {
            type:"narration",
            text:`3월의 공기는 이상하게 어색했다.<br><br>
            같은 학교, 같은 교실인데도 모든 것이 조금씩 달라 보였다.
            책상 위에는 새 시간표가 놓여 있었고, 창문 너머 운동장에는 아직 겨울의 흔적이 남아 있었다.`
        },
        {
            type:"dialogue",
            npc:"minji",
            text:`야. 너 진짜 왔네.`
        },
        {
            type:"dialogue",
            npc:"minji",
            text:`나 너 오늘 결석할 줄 알았어.`
        },
        {
            type:"narration",
            text:`민지는 네 책상 옆 의자에 자연스럽게 걸터앉았다.<br>
            초등학교 때부터 알고 지낸 친구라 그런지, 새 학기의 어색함도 그녀 앞에서는 조금 덜했다.`
        },
        {

/* =========================================================
   RENDER SCENE
========================================================= */

function loadScene(id){

    const scene=scenes[id];

    if(!scene){
        continueStory();
        return;
    }

    game.currentScene=id;

    document.getElementById("location").textContent=scene.location;
    document.getElementById("time").textContent=scene.time;

    const story=document.getElementById("story");
    story.innerHTML="";

    const chapter=document.createElement("div");
    chapter.className="chapter";
    chapter.textContent=scene.chapter;
    story.appendChild(chapter);

    const title=document.createElement("div");
    title.className="sceneTitle";
    title.textContent=scene.title;
    story.appendChild(title);

    scene.content.forEach(item=>{

        if(item.type==="narration"){

            const div=document.createElement("div");
            div.className="narration";
            div.innerHTML=item.text;
            story.appendChild(div);

        }

        else if(item.type==="dialogue"){

            const npc=game.relationships[item.npc];

            const box=document.createElement("div");
            box.className="dialogue";

            box.innerHTML=`
                <div class="dialogueAvatar">${npc.avatar}</div>
                <div class="dialogueBody">
                    <div class="speaker">${npc.name}</div>
                    <div class="bubble">${item.text}</div>
                </div>
            `;

            story.appendChild(box);
        }

    });

    const choices=document.getElementById("quickChoices");
    choices.innerHTML="";

    scene.choices.forEach((choice,i)=>{

        const btn=document.createElement("button");
        btn.className="choiceBtn";
        btn.textContent=(i+1)+". "+choice.text;

        btn.onclick=()=>{
            choice.action();
        };

        choices.appendChild(btn);

    });

    story.scrollTop=story.scrollHeight;

    updateStats();
    renderNPCs();
}


/* =========================================================
   PLAYER INPUT
========================================================= */

function sendPlayerInput(){

    const input=document.getElementById("playerInput");
    const text=input.value.trim();

    if(!text) return;

    addPlayerDialogue(text);
    input.value="";

    reactToInput(text);
}


function addPlayerDialogue(text){

    const story=document.getElementById("story");

    const box=document.createElement("div");
    box.className="dialogue me";

    box.innerHTML=`
        <div class="dialogueAvatar">🙂</div>
        <div class="dialogueBody">
            <div class="speaker">${game.name}</div>
            <div class="bubble">${escapeHTML(text)}</div>
        </div>
    `;

    story.appendChild(box);
    story.scrollTop=story.scrollHeight;
}


function reactToInput(text){

    const lower=text.toLowerCase();

    let target="minji";

    if(game.currentScene==="transfer" ||
       game.currentScene==="lunchTogether" ||
       game.currentScene==="transferSecret" ||
       game.currentScene==="walkTogether"){
        target="jiwon";
    }

    if(lower.includes("미안")){
        changeRelation(target,6,10);
        npcReply(target,"괜찮아. 네가 그렇게 말해주니까 오히려 좀 마음이 편하다.");
        return;
    }

    if(lower.includes("고마워") || lower.includes("고맙")){
        changeRelation(target,8,6);
        npcReply(target,"뭘 그런 걸 가지고 그래.");
        return;
    }

    if(lower.includes("좋아") || lower.includes("좋다")){
        changeRelation(target,7,4);
        npcReply(target,"...진짜?");
        return;
    }

    if(lower.includes("싫어") || lower.includes("싫다")){
        changeRelation(target,-7,-3);
        npcReply(target,"아... 그래. 알겠어.");
        return;
    }

    if(lower.includes("ㅋㅋ") || lower.includes("웃")){
        game.stats.happiness+=2;
        game.stats.charm+=1;
        npcReply(target,"ㅋㅋㅋ 너 진짜 웃기다.");
        return;
    }

    if(lower.includes("왜")){
        npcReply(target,"그냥... 설명하기가 좀 어렵네.");
        return;
    }

    if(lower.includes("같이")){
        changeRelation(target,5,5);
        npcReply(target,"그래. 같이 가자.");
        return;
    }

    if(lower.includes("안녕")){
        changeRelation(target,3,2);
        npcReply(target,"응. 안녕.");
        return;
    }

    npcReply(
        target,
        generateReaction(target,text)
    );
}


function generateReaction(target,text){

    const npc=game.relationships[target];

    if(npc.affinity>=80){
        return `네가 그런 말을 할 줄은 몰랐네. 그래도... 나는 네 말이 싫지는 않아.`;
    }

    if(npc.affinity>=60){
        return `음... 네가 그렇게 생각한다면 알겠어.`;
    }

    if(npc.affinity>=40){
        return `그럴 수도 있겠다. 조금 더 얘기해볼래?`;
    }

    return `아... 그렇구나.`;
}


function npcReply(target,text){

    setTimeout(()=>{

        const story=document.getElementById("story");
        const npc=game.relationships[target];

        const box=document.createElement("div");
        box.className="dialogue";

        box.innerHTML=`
            <div class="dialogueAvatar">${npc.avatar}</div>
            <div class="dialogueBody">
                <div class="speaker">${npc.name}</div>
                <div class="bubble">${text}</div>
            </div>
        `;

        story.appendChild(box);
        story.scrollTop=story.scrollHeight;

        addLog(`${npc.name}와 대화했다.`);

        updateStats();

    },450);
}


/* =========================================================
   RELATION
========================================================= */

function changeRelation(id,affinity,trust){

    const npc=game.relationships[id];

    if(!npc) return;

    npc.affinity=Math.max(0,Math.min(100,npc.affinity+affinity));
    npc.trust=Math.max(0,Math.min(100,npc.trust+trust));

    updateRelationName(id);
}


function updateRelationName(id){

    const npc=game.relationships[id];

    if(npc.affinity>=90) npc.relation="가장 소중한 사람";
    else if(npc.affinity>=80) npc.relation="절친";
    else if(npc.affinity>=70) npc.relation="친한 친구";
    else if(npc.affinity>=55) npc.relation="친구";
    else if(npc.affinity>=40) npc.relation="아는 사이";
    else if(npc.affinity>=25) npc.relation="어색한 사이";
    else npc.relation="거리감 있음";
}


/* =========================================================
   NPC RENDER
========================================================= */

function renderNPCs(){

    const list=document.getElementById("npcList");
    list.innerHTML="";

    Object.entries(game.relationships).forEach(([id,npc])=>{

        const div=document.createElement("div");
        div.className="npc";

        div.innerHTML=`
            <div class="npcAvatar">${npc.avatar}</div>
            <div class="npcInfo">
                <div class="npcName">${npc.name}</div>
                <div class="npcRelation">${npc.relation} · ${npc.affinity}</div>
            </div>
        `;

        div.onclick=()=>{
            showNPC(id);
        };

        list.appendChild(div);
    });
}


/* =========================================================
   DAY / STORY PROGRESSION
========================================================= */

function advanceDay(){

    game.day++;

    if(game.day>30){
        game.day=1;
        game.month++;

        if(game.month>12){
            game.month=1;
            game.age++;
        }
    }

    game.time="오전 8:00";

    addLog(`${game.age}세 · 새로운 하루가 시작되었다.`);

    randomLifeEvent();
}


function randomLifeEvent(){

    const r=Math.random();

    if(r<0.15){
        loadRandomEvent();
        return;
    }

    if(r<0.28){
        game.stats.happiness+=4;
        loadScene("newMorning");
        return;
    }

    if(r<0.40){
        loadScene("schoolMorning");
        return;
    }

    loadScene("newMorning");
}

    const story=document.getElementById("story");

    story.innerHTML=`

        ["장난스럽게 넘긴다",3,1]

    options.forEach(option=>{

        btn.className="choiceBtn";
        btn.textContent=option[0];

            changeRelation(event.target,option[1],option[2]);

            if(option[0]==="도와준다"){
                game.stats.happiness+=4;
            }

            addMemory(`${event.title} 사건에서 ${npc.name}과 상호작용했다.`);

            advanceDay();
        };

        document.getElementById("quickChoices").appendChild(btn);
    });

function continueStory(){

    if(game.age>=80){
        finishLife();
        return;
    }

    if(game.age>=18 && !game.flags.graduation){
        game.flags.graduation=true;
        loadScene("graduation");
        return;
    }

    if(game.age>=25){
        adultLife();
        return;
    }

    advanceDay();
}

/* =========================================================
   STATS / MEMORY
========================================================= */

function updateStats(){

    const map={
        Charm:"charm",
        Int:"intelligence",
        Health:"health",
        Creative:"creative",
        Luck:"luck",
        Happy:"happiness"
    };

    Object.keys(map).forEach(prefix=>{

        const key=map[prefix];

        const value=Math.max(0,Math.min(100,game.stats[key]));

        document.getElementById("s"+prefix).textContent=value;
        document.getElementById("b"+prefix).style.width=value+"%";

    });

    document.getElementById("profileSub").textContent=
        `${game.age}세 · ${getOccupation()}`;

    const latest=game.memories[game.memories.length-1];

    document.getElementById("currentMemory").textContent=
        latest || "아직 특별한 기억이 없다.";
}


function getOccupation(){

    if(game.age<19) return "학생";
    if(game.age<25) return "대학생";
    if(game.stats.creative>85) return "창작자";
    if(game.stats.intelligence>85) return "전문직";
    return "직장인";
}


function addMemory(text){

    game.memories.push(text);

    if(game.memories.length>30){
        game.memories.shift();
    }

    addLog(text);
    updateStats();
}


function addLog(text){

    game.log.unshift(text);

    if(game.log.length>30){
        game.log.pop();
    }

    const log=document.getElementById("lifeLog");

    if(!log) return;

    log.innerHTML=game.log.map(x=>
        `<div class="logItem">${escapeHTML(x)}</div>`
    ).join("");
}


/* =========================================================
   TABS / MODALS
========================================================= */

function showTab(tab){

    if(tab==="story"){
        closeModal();
        return;
    }

    if(tab==="memories"){
        showMemories();
        return;
    }

    if(tab==="character"){
        showCharacter();
        return;
    }
}


function showMemories(){

    const memories=game.memories.length
        ? game.memories.map((m,i)=>`<p>• ${escapeHTML(m)}</p>`).join("")
        : "<p>아직 기억이 없어.</p>";

    openModal(`
        <h2>▣ LIFE MEMORY</h2>
        ${memories}
        <button onclick="closeModal()">닫기</button>
    `);
}

    openModal(`

function openModal(html){

    document.getElementById("modalContent").innerHTML=html;

function closeModal(){

    document.getElementById("modal").classList.add("hidden");
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

    localStorage.setItem(
        "LIFE_RPG_ROLEPLAY_SAVE",
        JSON.stringify(game)
    );

    addLog("게임을 저장했다.");

    alert("저장 완료! 💾");
}


function loadGame(){

    const saved=localStorage.getItem("LIFE_RPG_ROLEPLAY_SAVE");

    if(!saved){
        alert("저장된 게임이 없어!");
        return;
    }

    game=JSON.parse(saved);

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    document.getElementById("profileName").textContent=game.name;

    renderNPCs();
    updateStats();

    if(game.currentScene){
        loadScene(game.currentScene);
    }

    alert("불러오기 완료! 🎮");
}

function finishLife(){

    const s=game.stats;

    if(s.fame>=90 && s.creative>=85){

    }

    else if(s.money>=1000000000){
        title="거대한 성공";
        text="수많은 선택과 실패를 지나 엄청난 부를 이루었다. 하지만 네 인생에서 가장 값진 것은 숫자로 표현할 수 없는 사람들이었다.";
    }

    else if(s.happiness>=90 && game.relationships.minji.affinity>=85){
        title="평범해서 더 행복한 삶";
        text="엄청난 명예도, 상상할 수 없는 부도 없었다. 대신 매일 돌아갈 곳이 있었고, 웃을 사람이 있었다.";
    }

    else if(game.flags.dating && game.relationships.jiwon.affinity>=90){
        title="끝까지 이어진 사랑";
        text="수많은 계절이 지나도 그 사람과의 첫 만남은 잊히지 않았다.";
    }

    else if(s.intelligence>=90){
        title="전문가의 삶";
        text="한 분야를 끝까지 파고든 끝에 누구나 인정하는 전문가가 되었다.";
    }

    else if(s.creative>=90){
        title="창작자의 삶";
        text="남들이 가지 않은 길을 선택했고, 자신만의 세계를 만들어냈다.";
    }

    else if(s.health>=90){
        title="건강한 인생";
        text="무엇보다 자신의 삶을 제대로 즐길 수 있는 몸과 마음을 지켜냈다.";
    }

    else{
        title="나만의 엔딩";
        text="완벽하지 않았다. 수없이 후회했고, 예상하지 못한 일도 많았다. 하지만 그것이 바로 네가 직접 살아온 인생이었다.";
    }

    document.getElementById("endingTitle").textContent=title;
    document.getElementById("endingText").textContent=text;

    document.getElementById("endingScreen").classList.remove("hidden");
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key==="Enter" && !e.shiftKey){

        const active=document.activeElement;

        if(active===document.getElementById("playerInput")){
            e.preventDefault();
            sendPlayerInput();
        }

    }

    const number=parseInt(e.key);

    if(number>=1 && number<=9){

        const buttons=document.querySelectorAll(".choiceBtn");

        if(buttons[number-1]){
            buttons[number-1].click();
        }
    }
});


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(str){

    return str
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   INITIAL
========================================================= */

updateStats();
